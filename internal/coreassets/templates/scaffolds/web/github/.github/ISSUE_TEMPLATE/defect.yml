name: Defect report
description: Report a defect. It becomes a regression scenario + a bound test, then closes on a green verify.
title: "[defect]: "
type: Bug
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        A defect is **ephemeral intake**. The fix adds or updates a scenario in the
        spec library (or a regression test bound to a new scenario); the issue closes
        when `specify verify` joins it green. The **lock is the proof** — not this issue.
  - type: input
    id: target
    attributes:
      label: Target
      description: Which target does this affect?
      placeholder: web
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Minimal, deterministic steps.
      placeholder: |
        1. …
        2. …
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior (the scenario)
      description: State it as *required behavior* — this is what becomes a Given/When/Then scenario.
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version / commit
      description: The `specify version` output and/or the commit SHA.
    validations:
      required: false
