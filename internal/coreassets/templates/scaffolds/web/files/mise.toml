[tools]
node = "24"
pnpm = "11"
# gh drives the GitHub-native surface and supplies the token the binary inherits;
# op resolves op:// secret references for `specify secrets sync`.
gh = "2.94"
op = "2"
# Local dependency-update gate (`mise run deps`): Renovate scans every ecosystem,
# jq formats its report. See scripts/deps-check.sh.
"npm:renovate" = "latest"
jq = "latest"

# Call npm binaries (vite, vitest, tsgo, oxlint, oxfmt, tsr) by bare name — no npx.
[env]
_.path = ['{{config_root}}/node_modules/.bin']

[tasks.routes]
description = "generate the TanStack Router tree (app/routes.gen.ts)"
run = "tsr generate"

[tasks.dev]
run = "vite dev"

[tasks.test]
description = "run Vitest with the junit reporter the engine joins"
run = "vitest run --reporter=junit --outputFile=junit.xml"

[tasks.typecheck]
description = "type-check with tsgo (needs the generated route tree)"
depends = ["routes"]
run = "tsgo --noEmit"

# Quality tasks — standard names the CI `quality` job calls (fmt:check/lint/typecheck).
# Scoped to app/ (the source) so the gate stays on code, not config/generated files.
[tasks.fmt]
description = "format app/ in place (Oxfmt)"
run = "oxfmt app"

[tasks."fmt:check"]
description = "fail if app/ needs formatting (Oxfmt)"
run = "oxfmt --check app"

[tasks.lint]
description = "lint app/ (Oxlint); needs the generated route tree"
depends = ["routes"]
run = "oxlint app"

[tasks.build]
run = "vite build"

# Local dependency check — advisory (never opens PRs, always exits 0). Replaces
# Dependabot: surfaces available updates as part of `mise run check`.
[tasks.deps]
description = "report available dependency updates (local Renovate dry-run; no PRs)"
run = "bash scripts/deps-check.sh"

[tasks.check]
description = "all local quality gates: fmt:check, lint, typecheck + the dependency heads-up"
depends = ["fmt:check", "lint", "typecheck", "deps"]
run = ":"
