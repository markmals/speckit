[tools]
node = "24"

# Call npm binaries (vite, vitest, tsgo) by bare name — no npx.
[env]
_.path = ['{{config_root}}/node_modules/.bin']

[tasks.dev]
run = "vite dev"

[tasks.test]
run = "vitest run --reporter=junit --outputFile=junit.xml"

[tasks.typecheck]
run = "tsgo"

[tasks.build]
run = "vite build"
