# SpecKit's reusable spec-gate workflow. A project's ci.yml calls it as one line:
#
#   verify:
#     uses: markmals/speckit/.github/workflows/gate.yml@v0.2.0
#     with:
#       target: web
#
# The resulting required status check is named `verify / verify` (caller job /
# reusable job) — use that exact context in the branch-protection ruleset. See
# docs/ci-gating.md.
#
# The gate is stack-neutral: it runs only the target's configured `command`
# (via `specify verify`) plus the specify checks. It performs no toolchain or
# dependency setup — use it when the runner's default toolchain can run your
# target's command (or the report is committed/prebuilt). A target that needs
# its own setup should run the composite action `markmals/speckit/gate@v0.2.0` as
# a step inside its own job, after its own setup steps.
name: SpecKit gate

on:
  workflow_call:
    inputs:
      target:
        description: The target to verify — a key in .speckit/specs.json.
        required: true
        type: string

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0 # the firewall diffs against the PR base
      - uses: markmals/speckit/gate@v0.2.0
        with:
          target: ${{ inputs.target }}
