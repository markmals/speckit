# SpecKit's reusable spec-gate workflow. A scaffolded project's ci.yml calls it
# as one line:
#
#   verify:
#     uses: markmals/speckit/.github/workflows/gate.yml@v1
#     with:
#       target: web
#       working_directory: apps/web
#
# The resulting required status check is named `verify / verify` (caller job /
# reusable job) — use that exact context in the branch-protection ruleset. See
# docs/ci-gating.md.
name: SpecKit gate

on:
  workflow_call:
    inputs:
      target:
        description: The target to verify — a key in .speckit/specs.json.
        required: true
        type: string
      working_directory:
        description: The target's app directory, for toolchain & dep install.
        required: false
        type: string
        default: ""

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # the firewall diffs against the PR base
      - uses: markmals/speckit/gate@v1
        with:
          target: ${{ inputs.target }}
          working_directory: ${{ inputs.working_directory }}
