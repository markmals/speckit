name: go

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: fmt
        if: matrix.os == 'ubuntu-latest'
        run: |
          unformatted=$(gofmt -l cmd internal)
          if [ -n "$unformatted" ]; then echo "gofmt needed:"; echo "$unformatted"; exit 1; fi
      - name: build
        run: go build ./...
      - name: vet
        run: go vet ./...
      - name: test
        run: go test ./...

  # SpecKit specifies itself: the engine's own behavior lives in features/ and
  # specs/models/, and its tests carry the same reverse pointers any adopting
  # project's would. If this job goes red, the spec library and the code
  # disagree.
  #
  # `verify` rewrites the committed lock shards on green, so this job must never
  # be paired with `gate generated` — see docs/ci-gating.md.
  spec:
    name: spec (self-verify)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: build specify
        run: go build -o /usr/local/bin/specify ./cmd/specify
      - name: scan
        run: specify scan
      - name: verify
        run: specify verify engine
      - name: drift
        run: specify drift engine
