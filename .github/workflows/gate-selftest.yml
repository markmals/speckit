# Self-test for the SpecKit gate Action (gate/action.yml).
#
# Runs the gate against testdata/act-fixture — a tiny end-to-end SpecKit project
# (one scenario, one bound test producing a junit report) — using a `specify`
# built from this very checkout (`specify_source: local`), so it works before
# the first release tag exists. The gate action is stack-neutral (it performs
# no toolchain setup), so this workflow sets up the fixture's toolchain itself
# before invoking the action — exactly the composition an adopting project
# uses. This exercises the runner glue the unit tests can't: `specify verify`
# running the fixture's configured command, the junit join, and parity.
#
# Runs in CI on PRs that touch the gate, and locally via `mise run act`.
#
# Note: the test-edit firewall is skipped here (workflow_dispatch / push have no
# PR base to diff, and it does not path-translate into a sub-directory project) —
# its logic is covered by the Go unit tests in internal/engine.
name: gate-selftest

on:
  pull_request:
    paths:
      - "gate/**"
      - ".github/workflows/gate-selftest.yml"
      - "testdata/act-fixture/**"
      - "cmd/specify/**"
      - "internal/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  selftest:
    runs-on: ubuntu-latest
    # mise-action installs the repo-root mise.toml; skip the local-only
    # container tools (act/colima/docker-cli) on the runner.
    env:
      MISE_DISABLE_TOOLS: act,colima,lima,docker-cli
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: jdx/mise-action@v4
      - name: Set up the fixture's toolchain & deps
        working-directory: testdata/act-fixture/app
        run: |
          mise trust
          mise install
          pnpm install --frozen-lockfile
      - uses: ./gate
        with:
          target: app
          project_dir: testdata/act-fixture
          specify_source: local
