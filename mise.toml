[tools]
go = "1.26"
# gh supplies the token the GitHub-native commands inherit (`gh auth token`) and
# backs `gh secret set`. 2.94 is the floor for the --type/--parent/--blocked-by
# automation the design relies on.
gh = "2.94"
# op (1Password CLI) resolves the op:// secret references for `specify secrets sync`.
op = "2"

# Local-only container tooling for the gate self-test (`mise run act`). OS-gated
# so the Windows CI matrix never tries to install them; CI's mise-action skips
# them via MISE_DISABLE_TOOLS in .github/workflows/gate-selftest.yml. colima is
# the mise-native Docker daemon (a Lima VM) since the macOS `docker` formula is
# CLI-only.
act = "0.2"
colima = { version = "0.10", os = ["macos", "linux"] }
lima = { version = "1", os = ["macos", "linux"] } # provides limactl, which colima drives
docker-cli = { version = "29", os = ["macos", "linux"] }

[tasks.build]
description = "compile all packages"
run = "go build ./..."

[tasks.vet]
description = "go vet"
run = "go vet ./..."

[tasks.test]
description = "run the test suite"
run = "go test ./..."

# The apple pack's deep skills (appkit-design/private-apis/app-inspector), the offline
# apple-hig HIG corpus, and the appkit-dev agent are GENERATED from the mac-dev-skills
# source (its other ~10 skills stay hand-maintained). These tasks need the source
# ($MAC_DEV_SKILLS_ROOT or ../skills/mac-dev-skills) and degrade with a clear error without
# it. CI enforces no-drift against markmals/mac-dev-skills (pinned) — see .github/workflows/ci-go.yml.
[tasks."apple-pack:generate"]
description = "regenerate the generated apple-pack skills + agent from the mac-dev-skills source"
run = "scripts/generate-apple-pack.sh"

[tasks."apple-pack:check"]
description = "fail if the generated apple-pack skills drift from the mac-dev-skills source (local)"
run = "scripts/generate-apple-pack.sh --check"

[tasks.fmt]
description = "format the tree in place"
run = "gofmt -w cmd internal"

[tasks."fmt:check"]
description = "fail if anything needs gofmt"
run = '''
unformatted=$(gofmt -l cmd internal)
if [ -n "$unformatted" ]; then
  echo "gofmt needed (run: mise run fmt):"
  echo "$unformatted"
  exit 1
fi
'''

[tasks.ci]
description = "everything CI runs, plus a gofmt gate — run before pushing"
depends = ["fmt:check"]
run = ["go build ./...", "go vet ./...", "go test ./..."]

[tasks.act]
description = "run the gate self-test workflow locally via act (boots colima if needed)"
# Note: the socket path is hard-coded rather than read from `docker context
# inspect -f '{{…}}'` because mise parses {{ }} as a Tera template.
run = '''
colima status >/dev/null 2>&1 || colima start
export DOCKER_HOST="unix://${HOME}/.colima/default/docker.sock"
act workflow_dispatch -W .github/workflows/gate-selftest.yml
'''
